<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Chittorgarh Battle Royale</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
}

button{
  font:inherit;
  user-select:none;
}

#menu{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  background:
    linear-gradient(rgba(25,18,10,.62),rgba(0,0,0,.94));
}

#menuBox{
  width:min(92%,410px);
  padding:25px;
  border-radius:22px;
  background:rgba(20,20,20,.95);
  border:1px solid #ffffff22;
  text-align:center;
  box-shadow:0 20px 60px #000;
}

#menuBox h1{
  margin:0 0 8px;
  font-size:30px;
}

#menuBox p{
  color:#ccc;
}

.modeButton,
#readyButton{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:0;
  border-radius:13px;
  color:white;
  font-weight:bold;
  background:#795126;
}

.modeButton.selected{
  background:#b9782d;
  box-shadow:0 0 0 2px #fff7;
}

#readyButton{
  margin-top:15px;
  background:#1877d2;
}

#roomInfo{
  margin-top:15px;
  min-height:58px;
  line-height:1.6;
  color:#ddd;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  color:white;
  pointer-events:none;
}

#title{
  position:absolute;
  top:10px;
  left:10px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#status{
  position:absolute;
  top:36px;
  left:10px;
  font-size:13px;
  text-shadow:0 2px 5px #000;
}

#team{
  position:absolute;
  top:57px;
  left:10px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#weapon{
  position:absolute;
  top:10px;
  right:10px;
  text-align:right;
  text-shadow:0 2px 5px #000;
}

#weaponName{
  font-size:14px;
}

#ammo{
  font-size:24px;
  font-weight:bold;
}

#health{
  position:absolute;
  left:18px;
  bottom:18px;
  padding:9px 13px;
  border-radius:10px;
  background:#000b;
  font-weight:bold;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:26px;
  height:26px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 4px #000;
}

#crosshair:before{
  width:24px;
  height:2px;
  left:1px;
  top:12px;
}

#crosshair:after{
  width:2px;
  height:24px;
  left:12px;
  top:1px;
}

#joystick{
  position:absolute;
  left:20px;
  bottom:20px;
  width:120px;
  height:120px;
  border:2px solid #ffffff44;
  border-radius:50%;
  background:#ffffff0d;
  pointer-events:auto;
}

#stick{
  position:absolute;
  left:33px;
  top:33px;
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ffffffbb;
  box-shadow:0 3px 12px #0008;
}

.action{
  position:absolute;
  right:22px;
  width:82px;
  height:58px;
  border:2px solid #ffffff88;
  border-radius:15px;
  color:white;
  font-weight:bold;
  pointer-events:auto;
  background:#222b;
}

#fire{
  right:18px;
  bottom:22px;
  width:92px;
  height:92px;
  border-radius:50%;
  background:#c02626dd;
}

#reload{
  bottom:125px;
}

#switch{
  bottom:193px;
}

#message{
  position:absolute;
  left:50%;
  top:40%;
  transform:translate(-50%,-50%);
  width:90%;
  text-align:center;
  font-size:30px;
  font-weight:bold;
  text-shadow:0 3px 10px #000;
  display:none;
}

#message button{
  margin-top:18px;
  padding:12px 22px;
  border:0;
  border-radius:11px;
  color:white;
  background:#1877d2;
  font-weight:bold;
}

#damageFlash{
  position:absolute;
  inset:0;
  background:rgba(255,0,0,.24);
  opacity:0;
  transition:opacity .08s;
}
</style>
</head>

<div id="menu">

    <p>Online Fort Battle</p>

    <button class="modeButton" data-mode="1v1">

    <button class="modeButton" data-mode="2v2">

<div id="hud">

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =====================================================
   SOCKET
===================================================== */

const socket = io();

/* =====================================================
   STATE
===================================================== */

let myId = null;
let myTeam = null;
let selectedMode = null;
let ready = false;
let gameStarted = false;
let myHP = 100;

const players = new Map();

/* =====================================================
   UI
===================================================== */

const menu =
document.getElementById("menu");

const hud =
document.getElementById("hud");

const roomInfo =
document.getElementById("roomInfo");

const readyButton =
document.getElementById("readyButton");

const statusText =
document.getElementById("status");

const teamText =
document.getElementById("team");

const weaponName =
document.getElementById("weaponName");

const ammoText =
document.getElementById("ammo");

const hpText =
document.getElementById("hp");

const damageFlash =
document.getElementById("damageFlash");

/* =====================================================
   MODE
===================================================== */

document
.querySelectorAll(".modeButton")
.forEach(button => {

  button.addEventListener("click", () => {

    document
    .querySelectorAll(".modeButton")
    .forEach(b =>
      b.classList.remove("selected")
    );

    button.classList.add("selected");

    selectedMode =
      button.dataset.mode;

    ready = false;

    readyButton.textContent =
      "READY";

    socket.emit(
      "selectMode",
      selectedMode
    );

    roomInfo.innerHTML =
      `Mode: <b>${selectedMode}</b><br>
       Joining room...`;

  });

});

/* =====================================================
   READY
===================================================== */

readyButton.addEventListener(
  "click",
  () => {

    if(!selectedMode){

      roomInfo.innerHTML =
        "⚠️ Pehle mode select karo.";

      return;

    }

    ready = !ready;

    socket.emit(
      "ready",
      ready
    );

    readyButton.textContent =
      ready
      ? "CANCEL READY"
      : "READY";

  }
);

/* =====================================================
   THREE SCENE
===================================================== */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x91a9b5);

scene.fog =
new THREE.Fog(
  0x91a9b5,

);

/* =====================================================
   CAMERA
===================================================== */

const camera =
new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,

);

camera.position.set(
  0,

);

/* =====================================================
   RENDERER
===================================================== */

const renderer =
new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(

  innerHeight
);

renderer.setPixelRatio(
  Math.min(

);

renderer.shadowMap.enabled =
true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
THREE.SRGBColorSpace;

document.body.appendChild(

/* =====================================================
   LIGHTING
===================================================== */

new THREE.HemisphereLight(

  2.1
);

scene.add(hemi);

const sun =
new THREE.DirectionalLight(
  0xffe1a3,
  3.5
);

sun.position.set(
  -50,
  100,
  45
);

sun.castShadow = true;

sun.shadow.mapSize.width =
2048;

sun.shadow.mapSize.height =
2048;

sun.shadow.camera.left =
-100;

sun.shadow.camera.right =
100;

sun.shadow.camera.top =
100;

sun.shadow.camera.bottom =
-100;

scene.add(sun);

/* =====================================================
   MATERIALS
===================================================== */

const groundMat =
new THREE.MeshStandardMaterial({
  color:0x796548,
  roughness:1
});

const sandstone =
new THREE.MeshStandardMaterial({
  color:0x9a7650,
  roughness:.92

const darkStone =
new THREE.MeshStandardMaterial({
  color:0x66523d,
  roughness:1
});

new THREE.MeshStandardMaterial({

});

const roofMat =
new THREE.MeshStandardMaterial({
  color:0x68482f,
  roughness:1
});

const roadMat =
new THREE.MeshStandardMaterial({
  color:0x625541,
  roughness:1
});

const grassMat =
new THREE.MeshStandardMaterial({
  color:0x4d5d38,
  roughness:1
});

const waterMat =
new THREE.MeshStandardMaterial({
  color:0x466f76,
  roughness:.3,
  metalness:.05
});

/* =====================================================
   MAP HELPERS
===================================================== */

function box(
  x,y,z,
  w,h,d,
  mat,
  rotationY=0
){

  const mesh =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,h,d
    ),
    mat
  );

  mesh.position.set(
    x,
    y+h/2,
    z
  );

  mesh.rotation.y =
    rotationY;

  mesh.castShadow = true;

  mesh.receiveShadow = true;

  scene.add(mesh);

  return mesh;

}

function cylinder(
  x,y,z,
  radius,
  height,
  mat,
  segments=16
){

  const mesh =
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      radius,
      radius*1.08,
      height,
      segments
    ),
    mat
  );

  mesh.position.set(
    x,
    y+height/2,
    z
  );

  mesh.castShadow = true;

  mesh.receiveShadow = true;

  scene.add(mesh);

  return mesh;

}

function coneRoof(
  x,y,z,
  radius,
  height,
  mat
){

  const mesh =
  new THREE.Mesh(
    new THREE.ConeGeometry(
      radius,
      height,
      6
    ),
    mat
  );

  mesh.position.set(
    x,
    y+height/2,
    z
  );

  mesh.castShadow = true;

  scene.add(mesh);

  return mesh;

}

/* =====================================================
   FORT ISLAND
===================================================== */

/* =====================================================

===================================================== */

const wallHeight = 8;

const wallLength = 145;

box(

/* =====================================================
   WALL BATTLEMENTS
===================================================== */

function battlementsHorizontal(z){

battlementsHorizontal(-72);
battlementsHorizontal(72);

battlementsVertical(-72);

/* =====================================================
   GATE FUNCTION
===================================================== */

function createGate(
  x,z,
  rotation=0,
  name=""
){

  const gate =
  new THREE.Group();

  gate.position.set(
    x,
    0,
    z
  );

  gate.rotation.y =
    rotation;

  const left =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      5,
      12,
      7
    ),
    sandstone
  );

  left.position.set(
    -5,
    6,
    0
  );

  left.castShadow = true;

  gate.add(left);

  const right =
  left.clone();

  right.position.x =
    5;

  gate.add(right);

  const top =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      15,
      4,
      7
    ),
    sandstone
  );

  top.position.y =
    12;

  top.castShadow = true;

  gate.add(top);

  scene.add(gate);

}

/* =====================================================

===================================================== */

createGate(

box(

/* =====================================================
   COURTYARD FUNCTION
===================================================== */

function courtyard(
  x,z,
  w,d
){

  box(
    x,
    .08,
    z,
    w,
    .12,
    d,
    palaceMat
  );

  box(
    x-w/2+1,
    .1,
    z,
    2,
    .2,
    d,
    darkStone
  );

  box(
    x+w/2-1,
    .1,
    z,
    2,
    .2,
    d,
    darkStone
  );

}

/* =====================================================
   MAHAL FUNCTION
===================================================== */

function mahal(
  x,z,
  w,d,
  h
){

  const body =
  box(
    x,
    0,
    z,
    w,
    h,
    d,
    palaceMat
  );

  /* central entrance */

  box(
    x,
    0,
    z-d/2-.4,
    5,
    h*.65,
    1.2,
    darkStone
  );

  /* roof */

  box(
    x,
    h,
    z,
    w+1,
    1.2,
    d+1,
    roofMat
  );

  /* corner towers */

  cylinder(
    x-w/2+2,
    h,
    z-d/2+2,
    2.5,
    3,
    sandstone
  );

  cylinder(
    x+w/2-2,
    h,
    z-d/2+2,
    2.5,
    3,
    sandstone
  );

  coneRoof(
    x-w/2+2,
    h+3,
    z-d/2+2,
    3,
    3,
    roofMat
  );

  coneRoof(
    x+w/2-2,
    h+3,
    z-d/2+2,
    3,
    3,
    roofMat
  );

  return body;

}

/* =====================================================
   STAIRS
===================================================== */

function stairs(
  x,z,
  rotation=0
){

  const group =
  new THREE.Group();

  for(
    let i=0;
    i<8;
    i++
  ){

    const step =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        7,
        .5+i*.03,
        1.2
      ),
      darkStone
    );

    step.position.set(
      0,
      .25+i*.35,
      -i*.9
    );

    step.castShadow = true;

    group.add(step);

  }

  group.position.set(
    x,
    0,
    z
  );

  group.rotation.y =
    rotation;

  scene.add(group);

}

stairs(
  0,
  -49,
  0
);

stairs(
  0,
  48,
  Math.PI
);

/* =====================================================
   TREES
===================================================== */

function tree(
  x,z,
  scale=1
){

  const group =
  new THREE.Group();
