/* =====================================================
   AUDIO
===================================================== */

let audioContext=null;

function initAudio(){

  if(!audioContext){

    audioContext=
      new (
        window.AudioContext||
        window.webkitAudioContext
      )();

  }

  if(audioContext.state==="suspended")
    audioContext.resume();

}

function sound(
  type
){

  initAudio();

  const ctx=audioContext;

  const osc=
    ctx.createOscillator();

  const gain=
    ctx.createGain();

  osc.connect(gain);
  gain.connect(ctx.destination);

  const now=ctx.currentTime;

  if(type==="footstep"){

    osc.type="triangle";
    osc.frequency.setValueAtTime(
      85,now
    );

    gain.gain.setValueAtTime(
      .0001,now
    );

    gain.gain.exponentialRampToValueAtTime(
      .045,now+.01
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,now+.08
    );

    osc.start(now);
    osc.stop(now+.09);

  }

  if(type==="hit"){

    osc.type="square";
    osc.frequency.setValueAtTime(
      620,now
    );

    osc.frequency.exponentialRampToValueAtTime(
      180,now+.11
    );

    gain.gain.setValueAtTime(
      .0001,now
    );

    gain.gain.exponentialRampToValueAtTime(
      .08,now+.01
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,now+.12
    );

    osc.start(now);
    osc.stop(now+.13);

  }

  if(type==="reload"){

    osc.type="sine";
    osc.frequency.setValueAtTime(
      320,now
    );

    gain.gain.setValueAtTime(
      .0001,now
    );

    gain.gain.exponentialRampToValueAtTime(
      .05,now+.02
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,now+.18
    );

    osc.start(now);
    osc.stop(now+.2);

  }

  if(type==="shoot"){

    osc.type="sawtooth";
    osc.frequency.setValueAtTime(
      100,now
    );

    osc.frequency.exponentialRampToValueAtTime(
      42,now+.08
    );

    gain.gain.setValueAtTime(
      .0001,now
    );

    gain.gain.exponentialRampToValueAtTime(
      .16,now+.005
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,now+.09
    );

    osc.start(now);
    osc.stop(now+.1);

  }

}

function addBox(
  x,y,z,w,h,d,
  material,
  collision=true
){

  const mesh=
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,h,d
    ),
    material
  );

  mesh.position.set(
    x,
    y+h/2,
    z
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  if(collision){

    collisionObjects.push({
      minX:x-w/2,
      maxX:x+w/2,
      minZ:z-d/2,
      maxZ:z+d/2
    });

  }

  return mesh;
}

function addCylinder(
  x,y,z,r,h,material,
  collision=true
){

  const mesh=
  new THREE.Mesh(
    new THREE.CylinderGeometry(
      r,r*1.08,h,16
    ),
    material
  );

  mesh.position.set(
    x,y+h/2,z
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  if(collision){

    collisionObjects.push({
      minX:x-r,
      maxX:x+r,
      minZ:z-r,
      maxZ:z+r
    });

  }

  return mesh;
}

function roof(
  x,y,z,r,h,material
){

    ),
    material
  );

  mesh.position.set(
    x,y+h/2,z
  );

  mesh.castShadow=true;

  scene.add(mesh);

  return mesh;
}
