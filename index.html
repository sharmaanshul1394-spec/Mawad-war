<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chittorgarh Battle Royale</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
}

button{
  font:inherit;
  user-select:none;
}

#menu{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  background:linear-gradient(#20170dcc,#000f);
}

#menuBox{
  width:min(92%,410px);
  padding:25px;
  border-radius:22px;
  background:#171717f5;
  text-align:center;
  box-shadow:0 20px 60px #000;
}

#menuBox h1{
  margin:0 0 8px;
}

.modeButton,
#readyButton{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:0;
  border-radius:13px;
  color:white;
  background:#795126;
  font-weight:bold;
}

.modeButton.selected{
  background:#b9782d;
  box-shadow:0 0 0 2px #fff8;
}

#readyButton{
  background:#1877d2;
}

#roomInfo{
  margin:15px 0;
  line-height:1.6;
  color:#ddd;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  color:white;
  pointer-events:none;
}

#title{
  position:absolute;
  top:10px;
  left:10px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#status{
  position:absolute;
  top:37px;
  left:10px;
  font-size:13px;
  text-shadow:0 2px 5px #000;
}

#team{
  position:absolute;
  top:58px;
  left:10px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#weapon{
  position:absolute;
  top:10px;
  right:10px;
  text-align:right;
  text-shadow:0 2px 5px #000;
}

#ammo{
  font-size:24px;
  font-weight:bold;
}

#health{
  position:absolute;
  left:18px;
  bottom:18px;
  padding:9px 13px;
  border-radius:10px;
  background:#000c;
  font-weight:bold;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:25px;
  height:25px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 4px #000;
}

#crosshair:before{
  width:24px;
  height:2px;
  left:1px;
  top:12px;
}

#crosshair:after{
  width:2px;
  height:24px;
  left:12px;
  top:1px;
}

#joystick{
  position:absolute;
  left:20px;
  bottom:20px;
  width:120px;
  height:120px;
  border:2px solid #ffffff44;
  border-radius:50%;
  background:#ffffff10;
  pointer-events:auto;
}

#stick{
  position:absolute;
  left:33px;
  top:33px;
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ffffffbb;
}

.action{
  position:absolute;
  right:22px;
  width:82px;
  height:58px;
  border:2px solid #ffffff88;
  border-radius:15px;
  color:white;
  font-weight:bold;
  pointer-events:auto;
  background:#222c;
}

#fire{
  bottom:22px;
  width:92px;
  height:92px;
  border-radius:50%;
  background:#c52626dd;
}

#reload{
  bottom:125px;
}

#switch{
  bottom:193px;
}

#message{
  position:absolute;
  left:50%;
  top:40%;
  transform:translate(-50%,-50%);
  width:90%;
  text-align:center;
  font-size:30px;
  font-weight:bold;
  text-shadow:0 3px 10px #000;
  display:none;
  pointer-events:auto;
}

#message button{
  margin-top:18px;
  padding:12px 22px;
  border:0;
  border-radius:10px;
  background:#1877d2;
  color:white;
  font-weight:bold;
}

#damageFlash{
  position:absolute;
  inset:0;
  background:#f00;
  opacity:0;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="menu">
  <div id="menuBox">

    <h1>🏰 Chittorgarh</h1>
    <p>Fort Battle Online</p>

    <button class="modeButton" data-mode="1v1">
      ⚔️ 1 VS 1
    </button>

    <button class="modeButton" data-mode="2v2">
      👥 2 VS 2
    </button>

    <div id="roomInfo">
      Mode: Select a mode<br>
      Players: 0
    </div>

    <button id="readyButton">
      READY
    </button>

  </div>
</div>

<div id="hud">

  <div id="title">🏰 CHITTORGARH FORT</div>

  <div id="status">Waiting...</div>

  <div id="team">Team: -</div>

  <div id="weapon">
    <div id="weaponName">Pistol</div>
    <div id="ammo">12 / 60</div>
  </div>

  <div id="health">
    ❤️ HP: <span id="hp">100</span>
  </div>

  <div id="crosshair"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="fire" class="action">FIRE</button>
  <button id="reload" class="action">RELOAD</button>
  <button id="switch" class="action">SWITCH</button>

  <div id="damageFlash"></div>
  <div id="message"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
