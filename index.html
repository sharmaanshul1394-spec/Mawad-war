<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chittorgarh Battle Royale - Phase 11</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
}

button{
  font:inherit;
  user-select:none;
}

#menu{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  background:
    radial-gradient(circle at 50% 25%,#79512688,#000e),
    linear-gradient(#24180c,#000);
}

#menuBox{
  width:min(92%,420px);
  padding:26px;
  border-radius:22px;
  background:#171717f7;
  text-align:center;
  box-shadow:0 20px 70px #000;
  border:1px solid #ffffff18;
}

#menuBox h1{
  margin:0 0 6px;
  font-size:32px;
}

#menuBox p{
  color:#bbb;
}

.modeButton,
#readyButton{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:0;
  border-radius:13px;
  color:white;
  background:#795126;
  font-weight:bold;
}

.modeButton.selected{
  background:#b9782d;
  box-shadow:0 0 20px #b9782d55;
}

#readyButton{
  background:#1877d2;
}

#roomInfo{
  margin:15px 0;
  line-height:1.6;
  color:#ddd;
}

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  display:none;
  color:white;
  pointer-events:none;
}

#title{
  position:absolute;
  top:10px;
  left:10px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#status{
  position:absolute;
  top:37px;
  left:10px;
  font-size:13px;
  text-shadow:0 2px 5px #000;
}

#team{
  position:absolute;
  top:58px;
  left:10px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#weapon{
  position:absolute;
  top:10px;
  right:10px;
  text-align:right;
  text-shadow:0 2px 5px #000;
}

#weaponName{
  font-size:15px;
}

#ammo{
  font-size:24px;
  font-weight:bold;
}

#health{
  position:absolute;
  left:18px;
  bottom:18px;
  padding:9px 13px;
  border-radius:10px;
  background:#000c;
  font-weight:bold;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:27px;
  height:27px;
  transform:translate(-50%,-50%);
  transition:transform .08s;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 4px #000;
}

#crosshair:before{
  width:24px;
  height:2px;
  left:1px;
  top:12px;
}

#crosshair:after{
  width:2px;
  height:24px;
  left:12px;
  top:1px;
}

#joystick{
  position:absolute;
  left:20px;
  bottom:20px;
  width:120px;
  height:120px;
  border:2px solid #ffffff44;
  border-radius:50%;
  background:#ffffff10;
  pointer-events:auto;
}
