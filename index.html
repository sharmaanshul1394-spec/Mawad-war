<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Chittorgarh Battle Royale</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white;
}

#title{
  position:absolute;
  top:12px;
  left:12px;
  font-size:18px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#status{
  position:absolute;
  top:40px;
  left:12px;
  font-size:13px;
  text-shadow:0 2px 5px #000;
}

#weapon{
  position:absolute;
  top:65px;
  left:12px;
  font-size:14px;
  text-shadow:0 2px 5px #000;
}

#health{
  position:absolute;
  left:20px;
  bottom:22px;
  padding:10px 15px;
  border-radius:12px;
  background:rgba(0,0,0,.65);
  font-weight:bold;
}

#zone{
  position:absolute;
  right:15px;
  top:15px;
  padding:8px 12px;
  border-radius:10px;
  background:rgba(0,0,0,.6);
}

#joystick{
  position:absolute;
  left:22px;
  bottom:22px;
  width:115px;
  height:115px;
  border:2px solid rgba(255,255,255,.45);
  border-radius:50%;
  background:rgba(255,255,255,.08);
  pointer-events:auto;
}

#stick{
  position:absolute;
  left:31px;
  top:31px;
  width:50px;
  height:50px;
  border-radius:50%;
  background:rgba(255,255,255,.7);
}

#fire{
  position:absolute;
  right:25px;
  bottom:35px;
  width:82px;
  height:82px;
  border-radius:50%;
  border:2px solid white;
  background:rgba(200,30,30,.75);
  color:white;
  font-weight:bold;
  pointer-events:auto;
}

#pickup{
  position:absolute;
  right:30px;
  bottom:130px;
  padding:12px 18px;
  border:0;
  border-radius:12px;
  background:#d79b25;
  color:white;
  font-weight:bold;
  display:none;
  pointer-events:auto;
}
</style>
</head>

<body>

<div id="hud">

<div id="title">
🏰 CHITTORGARH BATTLE ROYALE
</div>

<div id="status">
Connecting...
</div>

<div id="weapon">
🔫 Weapon: None
</div>

<div id="zone">
⭕ Zone: 100%
</div>

<div id="health">
❤️ HP: <span id="hp">100</span>
</div>

<div id="joystick">
<div id="stick"></div>
</div>

<button id="fire">
FIRE
</button>

<button id="pickup">
🎒 PICK UP
</button>

</div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script type="module">

});

),
new THREE.MeshStandardMaterial({
color:0x806b52
})
);

ground.receiveShadow=true;

scene.add(ground);

function building(

z,

){

new THREE.Mesh(
new THREE.BoxGeometry(

),
new THREE.MeshStandardMaterial({
color
})
);

mesh.position.set(
x,
h/2,
z
);

mesh.castShadow=true;
mesh.receiveShadow=true;

scene.add(mesh);

}

);

building(

0xa18458
);

/* KIRTI STAMBH */

building(
23,25,
9,18,9,
0xa18458
);

/* TEMPLE */

building(
0,5,
20,8,16,
0x8c7358
);

/* SMALL BUILDINGS */

for(
let i=0;
i<18;
i++
){

let x=
Math.random()*110-55;

let z=
Math.random()*110-55;

building(
x,z,
5,3,5,
0x707650
);

}
