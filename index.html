<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Chittorgarh Battle Royale</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
}

button{
  font:inherit;
}

#menu{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  background:linear-gradient(#17202ddd,#000f);
}

#menuBox{
  width:min(92%,390px);
  padding:24px;
  border-radius:20px;
  background:#171717ee;
  text-align:center;
  box-shadow:0 10px 40px #000;
}

.modeButton,
#readyButton{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:0;
  border-radius:12px;
  color:white;
  background:#8a5a25;
  font-weight:bold;
}

#readyButton{
  background:#1877d2;
}

#roomInfo{
  margin:14px 0;
  line-height:1.6;
}

#hud{
  position:fixed;
  inset:0;
  z-index:5;
  color:white;
  pointer-events:none;
  display:none;
}

#title{
  position:absolute;
  top:10px;
  left:10px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#status{
  position:absolute;
  top:38px;
  left:10px;
  font-size:13px;
  text-shadow:0 2px 5px #000;
}

#team{
  position:absolute;
  top:60px;
  left:10px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#weapon{
  position:absolute;
  top:10px;
  right:10px;
  text-align:right;
  text-shadow:0 2px 5px #000;
}

#ammo{
  font-size:22px;
  font-weight:bold;
}

#health{
  position:absolute;
  left:18px;
  bottom:20px;
  padding:9px 13px;
  border-radius:10px;
  background:#000b;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:22px;
  height:22px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 3px black;
}

#crosshair:before{
  width:22px;
  height:2px;
  top:10px;
}

#crosshair:after{
  width:2px;
  height:22px;
  left:10px;
}

#joystick{
  position:absolute;
  left:20px;
  bottom:20px;
  width:115px;
  height:115px;
  border:2px solid #ffffff55;
  border-radius:50%;
  background:#ffffff10;
