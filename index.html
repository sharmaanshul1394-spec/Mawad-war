let audioContext=null;

function initAudio(){

  if(!audioContext){

    audioContext=
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(audioContext.state==="suspended"){
    audioContext.resume();
  }
}

function sound(type){

  try{
    initAudio();

    const ctx=audioContext;

    const osc=ctx.createOscillator();
    const gain=ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    const now=ctx.currentTime;

    if(type==="footstep"){

      osc.type="triangle";

      osc.frequency.setValueAtTime(
        85,now
      );

      gain.gain.setValueAtTime(
        .0001,now
      );

      gain.gain.exponentialRampToValueAtTime(
        .045,now+.01
      );

      gain.gain.exponentialRampToValueAtTime(
        .0001,now+.08
      );

      osc.start(now);
      osc.stop(now+.09);
    }

    if(type==="hit"){

      osc.type="square";

      osc.frequency.setValueAtTime(
        620,now
      );

      osc.frequency.exponentialRampToValueAtTime(
        180,now+.11
      );

      gain.gain.setValueAtTime(
        .0001,now
      );

      gain.gain.exponentialRampToValueAtTime(
        .08,now+.01
      );

      gain.gain.exponentialRampToValueAtTime(
        .0001,now+.12
      );

      osc.start(now);
      osc.stop(now+.13);
    }

    if(type==="reload"){

      osc.type="sine";

      osc.frequency.setValueAtTime(
        320,now
      );

      gain.gain.setValueAtTime(
        .0001,now
      );

      gain.gain.exponentialRampToValueAtTime(
        .05,now+.02
      );

      gain.gain.exponentialRampToValueAtTime(
        .0001,now+.18
      );

      osc.start(now);
      osc.stop(now+.2);
    }

    if(type==="shoot"){

      osc.type="sawtooth";

      osc.frequency.setValueAtTime(
        100,now
      );

      osc.frequency.exponentialRampToValueAtTime(
        42,now+.08
      );

      gain.gain.setValueAtTime(
        .0001,now
      );

      gain.gain.exponentialRampToValueAtTime(
        .16,now+.005
      );

      gain.gain.exponentialRampToValueAtTime(
        .0001,now+.09
      );

      osc.start(now);
      osc.stop(now+.1);
    }

  }catch(error){
    console.log("Audio error:",error);
  }
}

/* =====================================================
   MAP HELPERS
===================================================== */

function addBox(
  x,y,z,w,h,d,
  material,
  collision=true
){

  const mesh=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      material
    );

  mesh.position.set(
    x,
    y+h/2,
    z
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  if(collision){

    collisionObjects.push({
      minX:x-w/2,
      maxX:x+w/2,
      minZ:z-d/2,
      maxZ:z+d/2
    });
  }

  return mesh;
}

function addCylinder(
  x,y,z,r,h,
  material,
  collision=true
){

  const mesh=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        r,
        r*1.08,
        h,
        16
      ),
      material
    );

  mesh.position.set(
    x,
    y+h/2,
    z
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  if(collision){

    collisionObjects.push({
      minX:x-r,
      maxX:x+r,
      minZ:z-r,
      maxZ:z+r
    });
  }

  return mesh;
}

function roof(
  x,y,z,r,h,material
){

  const mesh=
    new THREE.Mesh(
      new THREE.ConeGeometry(
        r,
        h,
        8
      ),
      material
    );

  mesh.position.set(
    x,
    y+h/2,
    z
  );

  mesh.castShadow=true;

  scene.add(mesh);

  return mesh;
}

function createWeapon(type){

  const group=
    new THREE.Group();

  const dark=
    new THREE.MeshStandardMaterial({
      color:0x151719,
      metalness:.75,
      roughness:.25
    });

  const metal=

      color:0x464b50,

      roughness:.18
    });

  const wood=
    new THREE.MeshStandardMaterial({
      color:0x503321,
      roughness:.7
    });

  if(type==="Pistol"){

    const slide=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .22,.22,.9
        ),
        metal
      );

    slide.position.z=-.35;

    group.add(slide);

    const grip=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .18,.55,.2
        ),
        dark
      );

    grip.position.set(
      0,-.28,.05
    );

    grip.rotation.x=.2;

    group.add(grip);
  }

  if(type==="Rifle"){

    const body=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .25,.25,1.3
        ),
        dark
      );

    body.position.z=-.25;

    group.add(body);

    const barrel=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .045,
          .045,
          1.1,
          10

        metal
      );
