<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chittorgarh Battle Royale</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  inset:0;
  color:white;
  pointer-events:none;
}

#title{
  position:absolute;
  top:10px;
  left:10px;
  font-size:17px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

#status{
  position:absolute;
  top:38px;
  left:10px;
  font-size:13px;
  text-shadow:0 2px 5px #000;
}

#health{
  position:absolute;
  bottom:20px;
  left:18px;
  padding:9px 13px;
  background:#000b;
  border-radius:10px;
}

#weaponInfo{
  position:absolute;
  right:15px;
  bottom:125px;
  padding:10px;
  background:#000b;
  border-radius:10px;
  text-align:right;
}

#zone{
  position:absolute;
  top:12px;
  right:12px;
  padding:8px 10px;
  background:#000b;
  border-radius:10px;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:22px;
  height:22px;
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 3px black;
}

#crosshair:before{
  width:22px;
  height:2px;
  top:10px;
  left:0;
}

#crosshair:after{
  width:2px;
  height:22px;
  top:0;
  left:10px;
}

#joystick{
  position:absolute;
  left:20px;
  bottom:20px;
  width:115px;
  height:115px;
  border:2px solid #ffffff66;
  border-radius:50%;
  background:#ffffff10;
  pointer-events:auto;
}

#stick{
  position:absolute;
  left:31px;
  top:31px;
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ffffffbb;
}

.action{
  position:absolute;
  right:25px;
  width:78px;
  height:58px;
  border:2px solid white;
  border-radius:15px;
  color:white;
  font-weight:bold;
  pointer-events:auto;
}

#fire{
  bottom:30px;
  border-radius:50%;
  width:84px;
  height:84px;
  background:#c62828cc;
}

#reload{
  bottom:125px;
  background:#444c;
}

#pickup{
  bottom:195px;
  background:#b57a20dd;
  display:none;
}

#weaponSelect{
  bottom:265px;
  background:#333c;
}

#message{
  position:absolute;
  left:50%;
  top:35%;
  transform:translate(-50%,-50%);
  font-size:30px;
  font-weight:bold;
  text-align:center;
  text-shadow:0 3px 8px #000;
  display:none;
}
</style>
</head>

<body>

<div id="hud">

  <div id="title">
    🏰 CHITTORGARH BATTLE ROYALE
  </div>

  <div id="status">
    Connecting...
  </div>

  <div id="zone">
    ⭕ SAFE ZONE
  </div>

  <div id="health">
    ❤️ HP: <span id="hp">100</span>
  </div>

  <div id="weaponInfo">
    🔫 <span id="weapon">Pistol</span><br>
    <span id="ammo">12 / 60</span>
  </div>

  <div id="crosshair"></div>

  <div id="message"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button
    id="fire"
    class="action">
    FIRE
  </button>

  <button
    id="reload"
    class="action">
    RELOAD
  </button>

  <button
    id="pickup
